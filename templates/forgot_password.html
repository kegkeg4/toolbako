{% extends "base.html" %}
{% block title %}パスワード再設定 — ツールバコ{% endblock %}
{% block content %}
<section class="auth-page"><div class="auth-card"><img class="auth-brand-icon" src="/static/brand/toolbako-icon.png?v={{ asset_version }}" width="192" height="192" alt="ツールバコ"><h1>パスワードを再設定</h1>
{% if submitted %}<div class="success-panel" role="status"><b>メールをご確認ください</b></div><p>登録がある場合、再設定リンクを送信しました。届かない場合は迷惑メールもご確認ください。</p><a class="button full" href="/login">ログインへ戻る</a>
{% else %}<p>登録したメールアドレスへ、期限つきの再設定リンクを送ります。</p><form method="post"><div class="field"><label for="recover-email">メールアドレス</label><input id="recover-email" type="email" name="email" maxlength="254" required autocomplete="email"></div><button class="button large full">再設定メールを送る</button></form><small><a href="/login">ログインへ戻る</a></small>{% endif %}
</div></section>
{% endblock %}
