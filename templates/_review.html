<article class="creator-review"><header><span class="avatar">{{ review.author[:1] }}</span><div><b>{{ review.author }}</b><small>{{ review.created_at.strftime('%Y/%m/%d') }}</small></div><strong>{% for _ in range(review.rating) %}★{% endfor %}{% for _ in range(5-review.rating) %}<i>★</i>{% endfor %}</strong></header><p>{{ review.comment or '評価のみ投稿されました。' }}</p><footer><span>{{ review.tool_name|default('カスタムAIツール',true) }}</span><em>取引完了済み ✓</em></footer></article>
