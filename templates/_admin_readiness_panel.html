<section class="readiness-panel"><header><div><h2>本番公開チェック</h2><p>{{ readiness.passed }}/{{ readiness.total }}項目で設定・実装条件を充足</p></div><span class="{{ 'ready' if readiness.ready else 'blocked' }}">{{ '実機検証へ' if readiness.ready else '公開前の対応が必要' }}</span></header><p role="note">{{ readiness.notice }}</p><div class="readiness-grid">{% for check in readiness.checks %}<article class="{% if check.ok %}done{% endif %}"><span>{{ '✓' if check.ok else loop.index }}</span><div><b>{{ check.label }}</b><small>{{ check.requirement }}</small></div><em>{{ check.owner }}</em></article>{% endfor %}</div></section>
