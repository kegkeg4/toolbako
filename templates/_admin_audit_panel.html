<section class="ops-section"><div class="ops-section-head"><h2>監査ログ</h2><span>直近{{ audit_logs|length }}件</span></div><div class="audit-list">{% for log in audit_logs %}<div><time>{{ log.created_at.strftime('%m/%d %H:%M') }}</time><b>{{ log.action }}</b><span>{{ log.target }}</span><code>{{ log.user_id|default('system',true) }}</code></div>{% else %}<p>重要操作はここに記録されます。</p>{% endfor %}</div></section>
