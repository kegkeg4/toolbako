<section id="reports" class="ops-section"><div class="ops-section-head"><h2>通報</h2><span>{{ reports|selectattr('status','equalto','open')|list|length }}件未対応</span></div><div class="admin-table rich">{% for r in reports %}<div><b>{{ r.target_type }} / {{ r.target_id }}</b><span>{{ r.reason or '理由なし' }}</span><span>{{ r.reporter }}</span><em>{{ r.status }}</em>{% if r.status=='open' %}<div><form action="/admin/reports/{{ r.id }}/resolved" method="post"><button>対応済み</button></form><form action="/admin/reports/{{ r.id }}/dismissed" method="post"><button>問題なし</button></form></div>{% endif %}</div>{% else %}<p>通報はありません。</p>{% endfor %}</div></section>
