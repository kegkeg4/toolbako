{% extends "base.html" %}
{% block title %}新しいパスワードを設定 — ツールバコ{% endblock %}
{% block content %}
<section class="auth-page"><div class="auth-card"><img class="auth-brand-icon" src="/static/brand/toolbako-icon.png?v={{ asset_version }}" width="192" height="192" alt="ツールバコ"><h1>新しいパスワード</h1><p>この画面を開いた再設定リンクは、利用後または期限切れになると使えません。</p>
{% if error %}<div class="form-error" role="alert">{{ error }}</div>{% endif %}
<form method="post" data-recovery-form><input type="hidden" name="access_token" data-recovery-token>
<div class="field"><label for="recovery-password">新しいパスワード</label><input id="recovery-password" type="password" name="password" minlength="10" maxlength="128" required autocomplete="new-password" data-password-input></div>
<div class="field"><label for="recovery-password-confirm">新しいパスワード（確認）</label><input id="recovery-password-confirm" type="password" name="password_confirmation" minlength="10" maxlength="128" required autocomplete="new-password" data-password-input></div>
<label class="password-toggle"><input type="checkbox" data-password-toggle> パスワードを表示</label>
<button class="button large full">パスワードを更新</button></form>
<div class="form-error" role="alert" data-recovery-error hidden>再設定リンクが無効です。再設定メールをもう一度送信してください。</div>
<small><a href="/forgot-password">再設定メールを送り直す</a></small></div></section>
{% endblock %}
