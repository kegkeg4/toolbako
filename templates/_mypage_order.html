<article class="mp-order"><div class="mp-order-icon">{{ order.tool_name[:1] }}</div><div class="mp-order-copy"><div><span class="status-pill status-{{ order.status }}">{{ status_labels[order.status] }}</span><small>{{ order.updated_at.strftime('%Y/%m/%d') }}</small></div><h3><a href="/orders/{{ order.id }}">{{ order.tool_name }}</a></h3><p>{% if order.buyer_id==user.id %}販売者：{{ order.seller_name }}{% else %}購入者：{{ order.buyer_name }}{% endif %}</p></div><strong>¥{{ '{:,}'.format(order.amount) }}</strong><a class="mp-order-go" href="/orders/{{ order.id }}" aria-label="{{ order.tool_name }}の取引を開く">→</a></article>
