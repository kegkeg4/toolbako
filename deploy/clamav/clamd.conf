DatabaseDirectory /var/lib/clamav
TemporaryDirectory /tmp
LocalSocket /tmp/clamd.sock
LocalSocketMode 660
FixStaleSocket yes
TCPSocket 3310
# No TCPAddr restriction: listen on both private IPv4 and IPv6 interfaces.
# Access relies on Railway private-network isolation; no public proxy/domain.
User clamav
Foreground yes
LogFile /var/log/clamav/clamd.log
LogTime yes
LogRotate yes
LogFileMaxSize 5M
LogClean no
MaxThreads 2
MaxQueue 4
StreamMaxLength 50000000
MaxScanSize 200M
MaxFileSize 50M
MaxRecursion 16
MaxFiles 500
MaxScanTime 15000
ReadTimeout 15
CommandReadTimeout 5
AlertExceedsMax yes
AlertEncrypted yes
ScanArchive yes
ExitOnOOM yes
ConcurrentDatabaseReload no
SelfCheck 600
