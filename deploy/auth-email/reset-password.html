<!doctype html>
<html lang="ja"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"></head>
<body style="margin:0;padding:24px;background:#f5f6f8;font-family:sans-serif;color:#20252c;line-height:1.8">
<main style="max-width:560px;margin:auto;padding:32px;background:#fff;border-radius:12px">
<p style="font-weight:bold">ツールバコ</p>
<h1 style="font-size:22px">パスワードの再設定</h1>
<p>パスワード再設定のリクエストを受け付けました。次のボタンで確認画面を開き、新しいパスワードを設定してください。</p>
<p><a href="{{ .SiteURL }}/auth/confirm#token_hash={{ .TokenHash }}&amp;type=recovery" style="display:inline-block;padding:12px 20px;background:#16794e;color:#fff;text-decoration:none;border-radius:6px">パスワードを再設定する</a></p>
<p>このメールに心当たりがない場合は、操作せずに破棄してください。</p>
