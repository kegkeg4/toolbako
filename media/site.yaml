# サイト全体の設定。公開URLは環境変数 SITE_URL で渡す（未設定ならnoindexのプレビュー）。
name: ツールバコ マガジン
tagline: 仕事で使うAIツールを、公式情報で比べる
description: 個人と小さな事業者のためのAIツール比較メディア。料金・機能・データの扱いを公式情報にもとづいて整理し、確認日と出典を明記します。

# 本番公開には name と contact が必須（build.py が検査する）。
operator:
  name: ""        # 例: 合同会社ONE
  contact: ""     # 例: 問い合わせフォームのURL または メールアドレス
  x_account: ""   # 例: toolbako_mag （@なし）

# Cloudflare Web Analytics のトークン（任意・Cookieを使わない計測）
analytics_token: ""

categories:
